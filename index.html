<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdnjs.cloudflare.com https://cdn.jsdelivr.net 'unsafe-inline'; style-src https://cdnjs.cloudflare.com 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>ДнД-проект: стол мастера</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--sea:#0f2a3a;--deep:#081822;--brass:#c9a24b;--foam:#e8eef0;--muted:#8aa3ae;--ok:#6fbf8b;--bad:#e07a6a;--line:#1d4256}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--deep);color:var(--foam);font:16px/1.5 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{width:100%;max-width:360px;background:var(--sea);border:1px solid var(--line);border-top:3px solid var(--brass);border-radius:6px;padding:1.5rem;font-family:system-ui,sans-serif}
.card h1{font:600 1.4rem Georgia,serif;margin:0 0 .2rem}
.sub{margin:0 0 1rem;color:var(--muted);font-size:14px}
label{display:block;font-size:14px;margin-bottom:.8rem;color:var(--muted)}
input{display:block;width:100%;margin-top:.25rem;padding:.55rem .6rem;border-radius:4px;border:1px solid var(--line);background:var(--deep);color:var(--foam);font:16px system-ui,sans-serif}
input:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button{background:var(--brass);color:#1a1405;border:0;border-radius:4px;padding:.55rem .9rem;font:600 14px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#loginForm button{width:100%;padding:.65rem}
.msg{min-height:1.4em;margin:.8rem 0 0;font-size:14px;color:var(--bad)}
.small{margin:.4rem 0 0;font-size:12px;color:var(--muted)}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.7rem 1rem;background:var(--sea);border-bottom:2px solid var(--brass)}
header h1{font-size:1.15rem;margin:0}
#who{font:14px system-ui,sans-serif;color:var(--muted);margin-right:.8rem}
main{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
#map{background:#0b2231}
aside{padding:1rem;overflow:auto;background:var(--sea);border-left:1px solid var(--line);font:14px/1.5 system-ui,sans-serif}
aside h2{font:600 1rem Georgia,serif;margin:.2rem 0 .6rem;color:var(--brass)}
table{width:100%;border-collapse:collapse;margin-bottom:1rem}
td{padding:.25rem 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tabs{display:flex;gap:.4rem}
.tab{background:transparent;color:var(--muted);border:1px solid var(--line)}
.tab[aria-selected="true"]{background:var(--brass);color:#1a1405;border-color:var(--brass)}
#charsView{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0;font-family:system-ui,sans-serif}
#charList{padding:1rem;overflow:auto;background:var(--sea);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.5rem}
.ch{display:flex;gap:.7rem;align-items:center;text-align:left;width:100%;background:var(--deep);color:var(--foam);border:1px solid var(--line);padding:.5rem}
.ch[aria-current="true"]{border-color:var(--brass)}
.av{width:48px;height:48px;border-radius:50%;background:var(--line);object-fit:cover;flex:none}
.ch small{display:block;color:var(--muted);font-weight:400}
#charEdit{padding:1.2rem;overflow:auto}
#charEdit form{max-width:460px}
#charEdit h2{font:600 1.1rem Georgia,serif;color:var(--brass);margin:0 0 1rem}
textarea,select{display:block;width:100%;margin-top:.25rem;padding:.55rem .6rem;border-radius:4px;border:1px solid var(--line);background:var(--deep);color:var(--foam);font:16px system-ui,sans-serif}
textarea{min-height:110px;resize:vertical}
.big{width:96px;height:96px;display:block;margin:.4rem 0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.good{color:var(--ok)}
.prog{max-width:460px;margin-top:1.5rem;border-top:1px solid var(--line);padding-top:1rem}
.prog h3{font:600 .95rem Georgia,serif;margin:1.1rem 0 .4rem;color:var(--brass)}
.prow{display:flex;align-items:center;gap:.6rem;padding:.3rem 0;border-bottom:1px solid var(--line)}
.prow span:first-child{flex:1}
.prow button{padding:.2rem .7rem}
.prow b{min-width:1.6rem;text-align:center}
.ms{color:var(--muted);font-size:14px;margin:.2rem 0}
.ms.ok{color:var(--ok)}
.ab{padding:.4rem 0;border-bottom:1px solid var(--line)}
.ab small{display:block;color:var(--muted)}
.num{width:4.2rem;display:inline-block;margin:0 .3rem}
#scenesView{flex:1;overflow:auto;padding:1.2rem;font-family:system-ui,sans-serif}
.scn{max-width:560px}
.scn h2{font:600 1.1rem Georgia,serif;color:var(--brass);margin:0 0 .6rem}
.sc{display:flex;gap:.6rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.sc span{flex:1}.sc small{display:block;color:var(--muted)}
.tag{color:var(--ok);font-size:13px}
@media(max-width:760px){#charsView{grid-template-columns:1fr;grid-template-rows:auto 1fr}#charList{border-right:0;border-bottom:1px solid var(--line);max-height:35vh}}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:60% 40%}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<section id="login">
  <form id="loginForm" class="card">
    <h1>ДнД-проект</h1>
    <p class="sub">Вход для мастера и игроков</p>
    <label>Почта<input id="email" type="email" autocomplete="username" required></label>
    <label>Пароль<input id="pass" type="password" autocomplete="current-password" required></label>
    <button id="loginBtn" type="submit">Войти</button>
    <p id="loginMsg" class="msg" role="alert"></p>
    <p id="guestCheck" class="small"></p>
  </form>
</section>

<section id="app" hidden>
  <header>
    <h1>ДнД-проект</h1>
    <div class="tabs" role="tablist"><button class="tab" id="tabChars" role="tab" type="button">Персонажи</button><button class="tab" id="tabScenes" role="tab" type="button">Сцены</button><button class="tab" id="tabMap" role="tab" type="button">Карта</button></div>
    <div><span id="who"></span><button id="logout" type="button">Выйти</button></div>
  </header>
  <main id="mapView" hidden>
    <div id="map" aria-label="Карта мира"></div>
    <aside>
      <h2>Таблицы базы</h2>
      <table id="tables"></table>
      <h2>Точка на карте</h2>
      <p>Нажмите на карту: появятся координаты. Карта пока оболочка, настоящую подключим позже.</p>
      <p id="coords">нет выбора</p>
    </aside>
  </main>
  <div id="scenesView" hidden>
    <div class="scn">
      <h2>Сцены</h2>
      <p id="curScene" class="ms"></p>
      <form id="sceneForm" hidden>
        <label>Название сцены<input id="sName" maxlength="80" required></label>
        <label>Тип
          <select id="sKind"><option value="location">Локация</option><option value="generated">Сгенерированная</option><option value="route_segment">Сегмент маршрута</option><option value="world">Мир</option></select>
        </label>
        <button type="submit">Создать сцену</button>
      </form>
      <div id="sceneList"></div>
      <p id="sceneMsg" class="msg" role="status"></p>
    </div>
  </div>
  <div id="charsView">
    <div id="charList"></div>
    <div id="charEdit">
      <form id="charForm">
        <h2 id="charTitle">Новый персонаж</h2>
        <label>Имя<input id="cName" maxlength="40" required></label>
        <label>Класс
          <select id="cClass"><option value="warrior">Воин</option><option value="wizard">Волшебник</option><option value="rogue">Плут</option><option value="cleric_druid">Жрец или друид</option></select>
        </label>
        <label>Заметки<textarea id="cNotes" maxlength="2000"></textarea></label>
        <label>Фото (будет сжато до 512 пикселей)<input id="cPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <img id="cPreview" class="av big" alt="" hidden>
        <div class="row"><button id="saveBtn" type="submit">Сохранить</button><button id="delBtn" class="danger" type="button" hidden>Удалить</button></div>
        <p id="charMsg" class="msg" role="status"></p>
      </form>
      <div id="progress" class="prog" hidden></div>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://brotwfmicsbvxubpzxba.supabase.co";
const SUPABASE_KEY = "sb_publishable_W_HXsPhO2fDL5-oMzdsiuA_PVT-cDbv"; // публичный ключ, данные защищены правилами базы
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const names = ["profiles","characters","character_progress","map_points","tokens","effects","fog_zones","settings","session_log","scenes"];

// ---- Карта (оболочка)
let map = null, marker = null;
function initMap() {
  if (map) { map.invalidateSize(); return; }
  const W = 150000, H = 100000, bounds = [[0, 0], [H, W]];
  map = L.map("map", {crs: L.CRS.Simple, minZoom: -9, maxZoom: 0, zoomSnap: .25, attributionControl: false});
  L.rectangle(bounds, {color: "#c9a24b", weight: 2, fillColor: "#123246", fillOpacity: 1}).addTo(map);
  for (let x = 0; x <= W; x += 10000) L.polyline([[0, x], [H, x]], {color: "#1d4256", weight: 1}).addTo(map);
  for (let y = 0; y <= H; y += 10000) L.polyline([[y, 0], [y, W]], {color: "#1d4256", weight: 1}).addTo(map);
  map.fitBounds(bounds);
  map.on("click", e => {
    $("coords").textContent = "x " + Math.round(e.latlng.lng) + ", y " + Math.round(H - e.latlng.lat);
    if (marker) marker.remove();
    marker = L.circleMarker(e.latlng, {radius: 6, color: "#c9a24b", fillOpacity: .9}).addTo(map);
  });
}

// ---- Проверка для гостя (на экране входа): данные должны быть закрыты
async function guestCheck() {
  let open = 0;
  for (const n of names) {
    const { data, error } = await db.from(n).select("*").limit(1);
    if (!error && data.length) open++;
  }
  $("guestCheck").textContent = open ? "Внимание: гость видит данные (" + open + ")" : "Защита: гостю данные закрыты";
}

// ---- Экраны
function showLogin() {
  me = null; if (chan) { db.removeChannel(chan); chan = null; }
  $("app").hidden = true; $("login").hidden = false;
  $("pass").value = ""; $("loginBtn").disabled = false;
  guestCheck();
}
async function showApp(session) {
  if (me && me.id === session.user.id) return;
  $("login").hidden = true; $("app").hidden = false;
  const { data } = await db.from("profiles").select("display_name,role").eq("id", session.user.id).maybeSingle();
  me = {id: session.user.id, master: !!(data && data.role === "master")};
  const role = me.master ? "Мастер" : "Игрок";
  $("who").textContent = ((data && data.display_name) || session.user.email) + " · " + role;
  const tbl = $("tables"); tbl.innerHTML = "";
  for (const n of names) {
    const { count, error } = await db.from(n).select("*", {count: "exact"}).limit(0);
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + n + "</td><td class='" + (error ? "bad" : "ok") + "'>" + (error ? "нет доступа" : count + " зап.") + "</td>";
    tbl.appendChild(tr);
  }
  sel = null; tab("chars"); loadChars(); loadScenes(); subscribeScenes();
}

// ---- Вкладки
const VIEWS = {chars: ["charsView", "tabChars"], scenes: ["scenesView", "tabScenes"], map: ["mapView", "tabMap"]};
function tab(name) {
  for (const [k, [v, b]] of Object.entries(VIEWS)) { $(v).hidden = k !== name; $(b).setAttribute("aria-selected", k === name); }
  if (name === "map") initMap();
  if (name === "scenes") loadScenes();
}
$("tabChars").onclick = () => tab("chars");
$("tabScenes").onclick = () => tab("scenes");
$("tabMap").onclick = () => tab("map");

// ---- Персонажи
const CLASSES = {warrior: "Воин", wizard: "Волшебник", rogue: "Плут", cleric_druid: "Жрец или друид"};
let me = null, chars = [], sel = null, urls = {}, photoBlob = null;
const msg = (t, ok) => { $("charMsg").textContent = t; $("charMsg").className = "msg" + (ok ? " good" : ""); };

async function loadChars() {
  const { data, error } = await db.from("characters").select("id,owner,name,class,photo_url,notes,profiles(display_name)").order("created_at");
  if (error) { msg("Не удалось загрузить персонажей."); return; }
  chars = data; urls = {};
  const paths = chars.map(c => c.photo_url).filter(Boolean);
  if (paths.length) {
    const r = await db.storage.from("photos").createSignedUrls(paths, 3600);
    (r.data || []).forEach(x => { if (x.signedUrl) urls[x.path] = x.signedUrl; });
  }
  await loadProgress();
  if (!sel && !me.master && chars.length) sel = chars[0].id;
  renderChars();
}

function avatar(c) {
  const el = document.createElement("img");
  el.className = "av"; el.alt = "";
  if (c && c.photo_url && urls[c.photo_url]) el.src = urls[c.photo_url]; else el.removeAttribute("src");
  return el;
}

function renderChars() {
  const list = $("charList"); list.innerHTML = "";
  if (me.master || !chars.length) {
    const b = document.createElement("button"); b.type = "button";
    b.textContent = "Новый персонаж"; b.onclick = () => { sel = null; renderChars(); };
    list.appendChild(b);
  }
  chars.forEach(c => {
    const b = document.createElement("button"); b.type = "button"; b.className = "ch";
    if (c.id === sel) b.setAttribute("aria-current", "true");
    const t = document.createElement("span"); t.textContent = c.name;
    const s = document.createElement("small");
    s.textContent = CLASSES[c.class] + (me.master && c.profiles ? " · " + c.profiles.display_name : "");
    t.appendChild(s);
    b.append(avatar(c), t); b.onclick = () => { sel = c.id; renderChars(); };
    list.appendChild(b);
  });
  const cur = chars.find(c => c.id === sel);
  $("charTitle").textContent = cur ? "Персонаж: " + cur.name : "Новый персонаж";
  $("cName").value = cur ? cur.name : ""; $("cClass").value = cur ? cur.class : "warrior";
  $("cNotes").value = cur ? cur.notes : ""; $("cPhoto").value = ""; photoBlob = null;
  const pv = $("cPreview"); const has = cur && cur.photo_url && urls[cur.photo_url];
  pv.hidden = !has; if (has) pv.src = urls[cur.photo_url];
  $("delBtn").hidden = !(me.master && cur);
  renderProgress(cur);
}

// ---- Прогресс: шкалы практики, вехи, открытые способности
const SCALES = {
  warrior: [["training","Тренировки"],["battles","Бои"],["weapons","Оружие"]],
  wizard: [["spells","Заклинания"],["places","Места силы"],["knowledge","Знания"]],
  rogue: [["deeds","Дела"],["connections","Связи"],["risk","Риск"]],
  cleric_druid: [["rites","Обряды"],["altars","Алтари"],["help","Помощь"]]};
let prog = {}, ms = [{k:1,n:2},{k:2,n:4},{k:3,n:6}]; // веха: на k шкалах по n действий
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };

async function loadProgress() {
  const r = await db.from("character_progress").select("character_id,practice,abilities");
  prog = {}; (r.data || []).forEach(p => prog[p.character_id] = p);
  const st = await db.from("settings").select("value").eq("key", "milestones").maybeSingle();
  if (st.data && Array.isArray(st.data.value) && st.data.value.length === 3) ms = st.data.value;
}
const getP = id => prog[id] || (prog[id] = {character_id: id, practice: {}, abilities: []});
const reached = (cls, p) => ms.map(m => SCALES[cls].filter(([k]) => (p.practice[k] || 0) >= m.n).length >= m.k);

async function saveProg(p) {
  const { error } = await db.from("character_progress").upsert({character_id: p.character_id, practice: p.practice, abilities: p.abilities}, {onConflict: "character_id"});
  if (error) { msg("Не удалось сохранить прогресс."); await loadProgress(); return false; }
  return true;
}

function renderProgress(cur) {
  const box = $("progress"); box.innerHTML = ""; box.hidden = !cur; if (!cur) return;
  const p = getP(cur.id), M = me.master;
  box.appendChild(el("h2", "", "Прогресс"));
  SCALES[cur.class].forEach(([key, label]) => {
    const row = el("div", "prow"); row.appendChild(el("span", "", label));
    const val = el("b", "", String(p.practice[key] || 0));
    if (M) {
      [["−", -1], ["+", 1]].forEach(([t, d], i) => {
        const b = el("button", "", t); b.type = "button"; b.setAttribute("aria-label", (d > 0 ? "Добавить: " : "Убрать: ") + label);
        b.onclick = async () => {
          const before = reached(cur.class, p).filter(Boolean).length;
          p.practice = {...p.practice, [key]: Math.max(0, (p.practice[key] || 0) + d)};
          if (await saveProg(p)) {
            const after = reached(cur.class, p).filter(Boolean).length;
            renderProgress(cur);
            if (after > before) msg("Достигнута веха " + after + ": можно открыть способность.", true);
          }
        };
        row.appendChild(b); if (i === 0) row.appendChild(val);
      });
    } else row.appendChild(val);
    box.appendChild(row);
  });
  box.appendChild(el("h3", "", "Вехи"));
  const r = reached(cur.class, p);
  ms.forEach((m, i) => box.appendChild(el("p", "ms" + (r[i] ? " ok" : ""), "Веха " + (i + 1) + ": на " + m.k + " шк. по " + m.n + " действий, " + (r[i] ? "достигнута" : "пока нет"))));
  box.appendChild(el("h3", "", "Открытые способности"));
  if (!p.abilities.length) box.appendChild(el("p", "ms", "Пока нет."));
  p.abilities.forEach(a => {
    const d = el("div", "ab", a.name); if (a.text) d.appendChild(el("small", "", a.text));
    if (M) { const b = el("button", "danger", "Убрать"); b.type = "button"; b.onclick = async () => { p.abilities = p.abilities.filter(x => x.id !== a.id); if (await saveProg(p)) renderProgress(cur); }; d.appendChild(b); }
    box.appendChild(d);
  });
  if (!M) return;
  const n = el("input"); n.placeholder = "Название способности"; n.maxLength = 60;
  const t = el("input"); t.placeholder = "Описание (необязательно)"; t.maxLength = 300;
  const add = el("button", "", "Открыть способность"); add.type = "button";
  add.onclick = async () => {
    if (!n.value.trim()) return;
    p.abilities = [...p.abilities, {id: crypto.randomUUID(), name: n.value.trim(), text: t.value.trim()}];
    if (await saveProg(p)) renderProgress(cur);
  };
  const f = el("div", "row"); f.append(n, t, add); box.appendChild(f);
  box.appendChild(el("h3", "", "Пороги вех (темп кампании)"));
  const inputs = ms.map((m, i) => {
    const k = el("input", "num"), c = el("input", "num"); k.type = c.type = "number"; k.min = c.min = 1; k.value = m.k; c.value = m.n;
    const line = el("p", "ms", "Веха " + (i + 1) + ": шкал "); line.append(k, " по ", c, " действий"); box.appendChild(line); return [k, c];
  });
  const sv = el("button", "", "Сохранить пороги"); sv.type = "button";
  sv.onclick = async () => {
    const v = inputs.map(([k, c]) => ({k: Math.min(3, Math.max(1, +k.value || 1)), n: Math.max(1, +c.value || 1)}));
    const { error } = await db.from("settings").upsert({key: "milestones", value: v}, {onConflict: "key"});
    if (error) msg("Не удалось сохранить пороги."); else { ms = v; renderProgress(cur); msg("Пороги сохранены.", true); }
  };
  box.appendChild(sv);
}

async function shrink(file) {
  const bmp = await createImageBitmap(file), k = Math.min(1, 512 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", .85));
}
$("cPhoto").addEventListener("change", async () => {
  const f = $("cPhoto").files[0]; if (!f) return;
  try { photoBlob = await shrink(f); $("cPreview").src = URL.createObjectURL(photoBlob); $("cPreview").hidden = false; }
  catch (e) { photoBlob = null; msg("Не получилось прочитать картинку."); }
});

$("charForm").addEventListener("submit", async e => {
  e.preventDefault(); msg("");
  const name = $("cName").value.trim(); if (!name) { msg("Укажите имя."); return; }
  $("saveBtn").disabled = true;
  const fields = {name, class: $("cClass").value, notes: $("cNotes").value};
  const cur = chars.find(c => c.id === sel);
  const q = cur ? db.from("characters").update(fields).eq("id", cur.id) : db.from("characters").insert({...fields, owner: me.id});
  const { data: row, error } = await q.select("id,owner,photo_url").single();
  if (error) { msg("Не удалось сохранить."); $("saveBtn").disabled = false; return; }
  let note = "Сохранено.";
  if (photoBlob) {
    const path = row.owner + "/" + row.id + "-" + Date.now() + ".jpg";
    const up = await db.storage.from("photos").upload(path, photoBlob, {contentType: "image/jpeg"});
    if (up.error) note = "Сохранено, но фото не загрузилось.";
    else { await db.from("characters").update({photo_url: path}).eq("id", row.id); if (row.photo_url) await db.storage.from("photos").remove([row.photo_url]); }
  }
  sel = row.id; await loadChars(); msg(note, note === "Сохранено."); $("saveBtn").disabled = false;
});

$("delBtn").addEventListener("click", async () => {
  const cur = chars.find(c => c.id === sel);
  if (!cur || !confirm("Удалить персонажа «" + cur.name + "»? Это нельзя отменить.")) return;
  const { error } = await db.from("characters").delete().eq("id", cur.id);
  if (error) { msg("Не удалось удалить."); return; }
  if (cur.photo_url) await db.storage.from("photos").remove([cur.photo_url]);
  sel = null; await loadChars(); msg("Удалено.", true);
});

// ---- Сцены: мастер создаёт и открывает для партии, игрок видит открытую сцену
const KINDS = {world: "Мир", location: "Локация", generated: "Сгенерированная", route_segment: "Сегмент маршрута"};
let scenes = [], chan = null;
const smsg = (t, ok) => { $("sceneMsg").textContent = t; $("sceneMsg").className = "msg" + (ok ? " good" : ""); };

async function loadScenes() {
  const { data, error } = await db.from("scenes").select("id,name,kind,is_current").order("created_at");
  if (error) { smsg("Сцены недоступны. Мастеру: выполните supabase_scenes.sql."); return; }
  smsg(""); scenes = data; renderScenes();
}
function renderScenes() {
  const cur = scenes.find(s => s.is_current);
  $("curScene").textContent = cur ? "Сейчас открыта: " + cur.name + " (" + KINDS[cur.kind] + ")"
    : (me.master ? "Ни одна сцена не открыта для партии." : "Мастер ещё не открыл сцену.");
  $("sceneForm").hidden = !me.master;
  const list = $("sceneList"); list.innerHTML = "";
  if (!me.master) return;
  scenes.forEach(s => {
    const row = el("div", "sc"), t = el("span", "", s.name); t.appendChild(el("small", "", KINDS[s.kind]));
    row.appendChild(t);
    if (s.is_current) row.appendChild(el("span", "tag", "открыта для партии"));
    else {
      const open = el("button", "", "Открыть для партии"); open.type = "button";
      open.onclick = async () => {
        const { error } = await db.rpc("set_current_scene", {p_id: s.id});
        if (error) smsg("Не удалось открыть сцену."); else { await loadScenes(); smsg("Сцена открыта.", true); }
      };
      row.appendChild(open);
    }
    const del = el("button", "danger", "Удалить"); del.type = "button";
    del.onclick = async () => {
      if (!confirm("Удалить сцену «" + s.name + "» вместе с её токенами, эффектами и туманом? Это нельзя отменить.")) return;
      const { error } = await db.from("scenes").delete().eq("id", s.id);
      if (error) smsg("Не удалось удалить."); else { await loadScenes(); smsg("Удалено.", true); }
    };
    row.appendChild(del); list.appendChild(row);
  });
}
$("sceneForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("sName").value.trim(); if (!name) return;
  const { error } = await db.from("scenes").insert({name, kind: $("sKind").value});
  if (error) { smsg("Не удалось создать сцену."); return; }
  $("sName").value = ""; await loadScenes(); smsg("Сцена создана.", true);
});
function subscribeScenes() {
  if (chan) return;
  chan = db.channel("scenes-live").on("postgres_changes", {event: "*", schema: "public", table: "scenes"}, () => loadScenes()).subscribe();
}

// ---- Вход и выход
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginBtn").disabled = true; $("loginMsg").textContent = "";
  const { error } = await db.auth.signInWithPassword({email: $("email").value.trim(), password: $("pass").value});
  if (error) {
    $("loginMsg").textContent = error.status === 400 ? "Неверная почта или пароль." : "Не получилось войти. Попробуйте ещё раз.";
    $("loginBtn").disabled = false;
  }
});
$("logout").addEventListener("click", () => db.auth.signOut());

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT" || !session) setTimeout(showLogin, 0);
  else if (event === "INITIAL_SESSION" || event === "SIGNED_IN") setTimeout(() => showApp(session), 0);
});
</script>
